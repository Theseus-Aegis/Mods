name: Extensions

on:
  push:
    paths:
      - 'extensions/**'
      - '.github/workflows/extensions.yml'
    branches:
      - '*'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable-x86_64-unknown-linux-gnu
            os: ubuntu-latest
            prefix: lib
            ext: .so
            to: _x64.so
          - toolchain: stable-x86_64-pc-windows-msvc
            os: windows-latest
            prefix: ""
            ext: .dll
            to: _x64.dll
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v4
    - name: Install Rust Toolchain
      run: rustup toolchain install ${{ matrix.toolchain }}
    - name: Test
      run: cd extensions && cargo +${{ matrix.toolchain }} test
    - name: Build
      run: cd extensions && cargo +${{ matrix.toolchain }} build --release
    - name: Move
      shell: bash
      run: |
        mkdir release
        for name in apollo_client apollo_server; do
          cp extensions/target/release/${{ matrix.prefix }}${name}${{ matrix.ext }} release/tac_${name}${{ matrix.to }}
        done
    - uses: actions/upload-artifact@v4
      with:
        name: extensions-${{ matrix.toolchain }}-${{ github.sha }}
        path: release
