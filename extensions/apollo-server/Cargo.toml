[package]
name = "apollo-server-rs"
version = "1.0.0"
authors = ["Theseus Incorporated <info@theseus-aegis.com>"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "apollo_server"
crate-type = ["cdylib", "rlib"]

[dependencies]
arma-rs = "1.11"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
simplelog = "0.12"
