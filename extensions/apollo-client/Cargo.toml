[package]
name = "apollo-client-rs"
version = "1.3.0"
authors = ["Theseus Incorporated <info@theseus-aegis.com>"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "apollo_client"
crate-type = ["cdylib", "rlib"]

[dependencies]
arma-rs = "1.13"
log = "0.4.34"
reqwest = { version = "0.13", features = ["blocking"] }
simplelog = "0.12"
